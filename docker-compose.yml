version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    volumes:
      - ./dbt_project:/usr/app/dbt_project
      - ~/.dbt:/root/.dbt
    env_file:
      - .env
    depends_on:
      - postgres

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: ecommerce_airflow
    restart: always
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - DBT_PROFILES_DIR=/opt/airflow/.dbt
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ./extract:/opt/airflow/extract
      - ~/.dbt:/opt/airflow/.dbt
      - airflow_data:/opt/airflow
    command: standalone

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ecommerce_dashboard
    restart: always
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app

volumes:
  pg_data:
  airflow_data:
